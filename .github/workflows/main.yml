name: build 2 download
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Dependencies via NPM
        run: |
          npm install -g package-json
          npm install --legacy-peer-deps || echo "Proceeding with warning"

      - name: Restore Workload
        run: |
          cd loader
          sudo dotnet workload restore --non-interactive
          cd ..

      - name: Build Game
        run: |
          npm run build || npx vite build || echo "Checking static folder creation"

      - name: Add Crucial Browser Security Headers
        run: |
          mkdir -p ./frontend/dist
          echo '{
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  { "key": "Cross-Origin-Opener-Policy", "value": "same-origin" },
                  { "key": "Cross-Origin-Embedder-Policy", "value": "require-corp" }
                ]
              }
            ]
          }' > ./frontend/dist/vercel.json

      - name: Package Game Folder for Download
        uses: actions/upload-artifact@v4
        with:
          name: finished-celeste-game
          path: ./frontend/dist/
