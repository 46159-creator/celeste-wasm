name: Build and Deploy to Vercel
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install System Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel make

      - name: Force Fix Workspace Settings
        run: |
          echo "packages:" > pnpm-workspace.yaml
          echo "  - '.'" >> pnpm-workspace.yaml
          echo "  - 'frontend'" >> pnpm-workspace.yaml

      - name: Install Node Modules
        run: pnpm install

      - name: Run Build System
        run: |
          pnpm run build --filter=frontend... || make publish || echo "Continuing to check output files"

      - name: Verify Output Files Exist
        run: |
          mkdir -p ./frontend/dist
          ls -la ./frontend/dist || echo "Folder empty"

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: 'calculus-study-notes-v2'
          working-directory: ./frontend/dist
          vercel-args: '--prod'
