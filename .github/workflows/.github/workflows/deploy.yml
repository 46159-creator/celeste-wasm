name: Build and Deploy to Vercel
on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wipe Developer Vercel Tracking
        run: |
          rm -rf .vercel
          rm -rf frontend/.vercel
          rm -rf frontend/dist/.vercel

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Dependencies
        run: pnpm install

      - name: Restore Workload
        run: |
          cd loader
          sudo dotnet workload restore
          cd ..

      - name: Build Game
        run: pnpm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: 'celeste-wasm-mirror' # Change this to a random name like 'math-notes'
          working-directory: ./frontend/dist
          vercel-args: '--prod'
