name: Build and Deploy to Vercel
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Missing Linux Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel make

      - name: Install Project Dependencies
        working-directory: ./frontend
        run: pnpm install

      - name: Restore .NET Workload (Bypass Prompts)
        run: |
          cd loader
          sudo dotnet workload restore --non-interactive
          cd ..

      - name: Build Game
        run: make publish

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: 'celeste-wasm' # Change this if you want a different URL name!
          working-directory: ./frontend/dist
          vercel-args: '--prod'
